name: AnyWorkflow File Converter · PDF to Markdown
run-name: file-converter-pdf-to-md-${{ inputs.request_id || github.event.client_payload.request_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      conversion_type:
        description: "File conversion handler"
        required: false
        default: "pdf_to_md"
        type: choice
        options:
          - pdf_to_md
      request_id:
        description: "External task ID for dispatch reconciliation"
        required: false
        type: string
      output_name:
        description: "Merged Markdown filename without extension"
        required: false
        default: "merged"
        type: string
      source_url:
        description: "PDF download URL (Google Drive shared link is supported)"
        required: true
        type: string
      images_per_request:
        description: "How many consecutive PDF pages/images to send in one Gemini request"
        required: true
        default: "1"
        type: string
      concurrency:
        description: "Maximum simultaneous Gemini requests"
        required: true
        default: "50"
        type: string
      prompt:
        description: "Prompt. Leave empty to use the built-in faithful Markdown conversion prompt"
        required: false
        default: ""
        type: string
      model:
        description: "Gemini model ID"
        required: true
        default: "gemini-3.5-flash-lite"
        type: string
      thinking_level:
        description: "Gemini thinking level"
        required: true
        default: "high"
        type: choice
        options:
          - high
          - medium
          - low
          - minimal
      dpi:
        description: "PDF render DPI"
        required: true
        default: "240"
        type: string
      image_format:
        description: "Rendered page format; PNG is lossless"
        required: true
        default: "png"
        type: choice
        options:
          - png
          - jpeg
      jpeg_quality:
        description: "JPEG quality (50-100; ignored for PNG)"
        required: true
        default: "95"
        type: string
      verification_passes:
        description: "Extra image-vs-Markdown verification passes"
        required: true
        default: "0"
        type: string
      media_resolution:
        description: "Gemini per-image media resolution"
        required: true
        default: "ultra_high"
        type: choice
        options:
          - ultra_high
          - high
          - medium
          - low
          - unspecified
      rpm_per_key:
        description: "Requests/minute for each project quota pool (legacy input name)."
        required: true
        default: "15"
        type: string
      rpd_per_key:
        description: "Requests/day for each project quota pool (legacy input name)."
        required: true
        default: "500"
        type: string
      start_page:
        description: "Optional first PDF page to process (1-based)"
        required: false
        default: ""
        type: string
      end_page:
        description: "Optional last PDF page to process (1-based)"
        required: false
        default: ""
        type: string

  repository_dispatch:
    types: [pdf_to_md]

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      CONVERSION_TYPE: ${{ github.event.inputs.conversion_type || github.event.client_payload.conversion_type || 'pdf_to_md' }}
      OUTPUT_NAME: ${{ github.event.inputs.output_name || github.event.client_payload.output_name || 'merged' }}
      SOURCE_URL: ${{ github.event.inputs.source_url || github.event.client_payload.source_url }}
      IMAGES_PER_REQUEST: ${{ github.event.inputs.images_per_request || github.event.client_payload.images_per_request || '1' }}
      CONCURRENCY: ${{ github.event.inputs.concurrency || github.event.client_payload.concurrency || '50' }}
      USER_PROMPT: ${{ github.event.inputs.prompt || github.event.client_payload.prompt || '' }}
      MODEL: ${{ github.event.inputs.model || github.event.client_payload.model || 'gemini-3.5-flash-lite' }}
      THINKING_LEVEL: ${{ github.event.inputs.thinking_level || github.event.client_payload.thinking_level || 'high' }}
      DPI: ${{ github.event.inputs.dpi || github.event.client_payload.dpi || '240' }}
      IMAGE_FORMAT: ${{ github.event.inputs.image_format || github.event.client_payload.image_format || 'png' }}
      JPEG_QUALITY: ${{ github.event.inputs.jpeg_quality || github.event.client_payload.jpeg_quality || '95' }}
      VERIFICATION_PASSES: ${{ github.event.inputs.verification_passes || github.event.client_payload.verification_passes || '0' }}
      MEDIA_RESOLUTION: ${{ github.event.inputs.media_resolution || github.event.client_payload.media_resolution || 'ultra_high' }}
      RPM_PER_KEY: ${{ github.event.inputs.rpm_per_key || github.event.client_payload.rpm_per_key || '15' }}
      RPD_PER_KEY: ${{ github.event.inputs.rpd_per_key || github.event.client_payload.rpd_per_key || '500' }}
      START_PAGE: ${{ github.event.inputs.start_page || github.event.client_payload.start_page || '' }}
      END_PAGE: ${{ github.event.inputs.end_page || github.event.client_payload.end_page || '' }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GEMINI_KEY_GROUPS: ${{ vars.GEMINI_KEY_GROUPS }}
      GEMINI_QUOTA_WORKER_URL: ${{ vars.GEMINI_QUOTA_WORKER_URL }}
      GEMINI_QUOTA_WORKER_TOKEN: ${{ secrets.GEMINI_QUOTA_WORKER_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate trigger payload
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CONVERSION_TYPE}" != "pdf_to_md" ]]; then
            echo "Unsupported conversion_type: ${CONVERSION_TYPE}" >&2
            exit 1
          fi
          if [[ -z "${SOURCE_URL}" ]]; then
            echo "source_url is required" >&2
            exit 1
          fi
          if [[ -z "${GEMINI_API_KEYS}" ]]; then
            echo "Repository secret GEMINI_API_KEYS is required" >&2
            exit 1
          fi
          if [[ -z "${GEMINI_QUOTA_WORKER_URL}" ]]; then
            echo "Repository variable GEMINI_QUOTA_WORKER_URL is required" >&2
            exit 1
          fi
          if [[ -z "${GEMINI_QUOTA_WORKER_TOKEN}" ]]; then
            echo "Repository secret GEMINI_QUOTA_WORKER_TOKEN is required" >&2
            exit 1
          fi

      - name: Convert PDF to Markdown
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --conversion-type "${CONVERSION_TYPE}"
            --source-url "${SOURCE_URL}"
            --images-per-request "${IMAGES_PER_REQUEST}"
            --concurrency "${CONCURRENCY}"
            --model "${MODEL}"
            --thinking-level "${THINKING_LEVEL}"
            --dpi "${DPI}"
            --image-format "${IMAGE_FORMAT}"
            --jpeg-quality "${JPEG_QUALITY}"
            --verification-passes "${VERIFICATION_PASSES}"
            --media-resolution "${MEDIA_RESOLUTION}"
            --rpm-per-key "${RPM_PER_KEY}"
            --rpd-per-key "${RPD_PER_KEY}"
            --work-dir work
            --output-dir output
          )
          if [[ -n "${USER_PROMPT}" ]]; then
            args+=(--prompt "${USER_PROMPT}")
          fi
          if [[ -n "${START_PAGE}" ]]; then
            args+=(--start-page "${START_PAGE}")
          fi
          if [[ -n "${END_PAGE}" ]]; then
            args+=(--end-page "${END_PAGE}")
          fi
          python pdf2md.py "${args[@]}"

      - name: Name Markdown result
        if: always()
        run: python prepare_result.py

      - name: Upload Markdown result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: file-converter-pdf-to-md-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 3
