name: AnyWorkflow File Converter · PDF to Markdown
run-name: file-converter-pdf-to-md-${{ inputs.request_id || github.event.client_payload.request_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      conversion_type:
        description: "File conversion handler"
        required: false
        default: "pdf_to_md"
        type: choice
        options:
          - pdf_to_md
      request_id:
        description: "External task ID for dispatch reconciliation"
        required: false
        type: string
      output_name:
        description: "Merged Markdown filename without extension"
        required: false
        default: "merged"
        type: string
      source_url:
        description: "PDF download URL (Google Drive shared link is supported)"
        required: true
        type: string
      provider:
        description: "Model gateway; Modelflare needs its own API key and a compatible vision model"
        required: true
        default: "gemini"
        type: choice
        options:
          - gemini
          - modelflare
      images_per_request:
        description: "How many consecutive PDF pages/images to send in one model request"
        required: true
        default: "1"
        type: string
      concurrency:
        description: "Local page workers; Gemini additionally uses the shared quota API"
        required: true
        default: "50"
        type: string
      system_prompt:
        description: "Shared system prompt read from the saved file-conversion config. It is sent before prompt and the two are appended, never merged. Leave empty to fall back to the built-in faithful Markdown conversion prompt."
        required: false
        default: ""
        type: string
      prompt:
        description: "Per-conversion prompt. Appended after system_prompt; leave empty to send only the system prompt."
        required: false
        default: ""
        type: string
      model:
        description: "Exact model ID. Empty uses the Gemini default; Modelflare requires a vision-capable model ID"
        required: false
        default: ""
        type: string
      model_fallbacks:
        description: "Comma-separated fallback models. Empty only falls back for the default model; custom models stay exact. Use none to disable."
        required: false
        default: ""
        type: string
      reasoning_effort:
        description: "Optional Modelflare reasoning effort; leave empty if the selected model does not support it"
        required: false
        default: ""
        type: string
      max_output_tokens:
        description: "Optional answer token cap; 0 lets the gateway choose"
        required: false
        default: "0"
        type: string
      retry_rounds:
        description: "Maximum passes per failed page; retries are scheduled independently."
        required: false
        default: "5"
        type: string
      attempts_per_page:
        description: "Immediate retries per page inside a round before the page is deferred to the next round."
        required: false
        default: "2"
        type: string
      thinking_level:
        description: "Gemini thinking level"
        required: true
        default: "high"
        type: choice
        options:
          - high
          - medium
          - low
          - minimal
      dpi:
        description: "PDF render DPI"
        required: true
        default: "240"
        type: string
      image_format:
        description: "Rendered page format; PNG is lossless"
        required: true
        default: "png"
        type: choice
        options:
          - png
          - jpeg
      jpeg_quality:
        description: "JPEG quality (50-100; ignored for PNG)"
        required: true
        default: "95"
        type: string
      verification_passes:
        description: "Extra image-vs-Markdown verification passes"
        required: true
        default: "0"
        type: string
      media_resolution:
        description: "Image resolution hint (mapped to low/high for Modelflare)"
        required: true
        default: "ultra_high"
        type: choice
        options:
          - ultra_high
          - high
          - medium
          - low
          - unspecified
      rpm_per_key:
        description: "Requests/minute for each project quota pool (legacy input name)."
        required: true
        default: "15"
        type: string
      rpd_per_key:
        description: "Requests/day for each project quota pool (legacy input name)."
        required: true
        default: "500"
        type: string
      start_page:
        description: "Optional first PDF page to process (1-based)"
        required: false
        default: ""
        type: string
      end_page:
        description: "Optional last PDF page to process (1-based)"
        required: false
        default: ""
        type: string

  repository_dispatch:
    types: [pdf_to_md]

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      CONVERSION_TYPE: ${{ github.event.inputs.conversion_type || github.event.client_payload.conversion_type || 'pdf_to_md' }}
      PROVIDER: ${{ github.event.inputs.provider || github.event.client_payload.provider || 'gemini' }}
      OUTPUT_NAME: ${{ github.event.inputs.output_name || github.event.client_payload.output_name || 'merged' }}
      SOURCE_URL: ${{ github.event.inputs.source_url || github.event.client_payload.source_url }}
      IMAGES_PER_REQUEST: ${{ github.event.inputs.images_per_request || github.event.client_payload.images_per_request || '1' }}
      CONCURRENCY: ${{ github.event.inputs.concurrency || github.event.client_payload.concurrency || '50' }}
      SYSTEM_PROMPT: ${{ github.event.inputs.system_prompt || github.event.client_payload.system_prompt || '' }}
      USER_PROMPT: ${{ github.event.inputs.prompt || github.event.client_payload.prompt || '' }}
      MODEL: ${{ github.event.inputs.model || github.event.client_payload.model || '' }}
      MODEL_FALLBACKS: ${{ github.event.inputs.model_fallbacks || github.event.client_payload.model_fallbacks || '' }}
      REASONING_EFFORT: ${{ github.event.inputs.reasoning_effort || github.event.client_payload.reasoning_effort || '' }}
      MAX_OUTPUT_TOKENS: ${{ github.event.inputs.max_output_tokens || github.event.client_payload.max_output_tokens || '0' }}
      RETRY_ROUNDS: ${{ github.event.inputs.retry_rounds || github.event.client_payload.retry_rounds || '5' }}
      ATTEMPTS_PER_PAGE: ${{ github.event.inputs.attempts_per_page || github.event.client_payload.attempts_per_page || '2' }}
      HEDGE_AFTER: ${{ (github.event.client_payload.hedge_after != null && format('{0}', github.event.client_payload.hedge_after)) || vars.CONVERTER_HEDGE_AFTER || '60' }}
      HEDGE_BUDGET: ${{ (github.event.client_payload.hedge_budget != null && format('{0}', github.event.client_payload.hedge_budget)) || vars.CONVERTER_HEDGE_BUDGET || '-1' }}
      THINKING_LEVEL: ${{ github.event.inputs.thinking_level || github.event.client_payload.thinking_level || 'high' }}
      DPI: ${{ github.event.inputs.dpi || github.event.client_payload.dpi || '240' }}
      IMAGE_FORMAT: ${{ github.event.inputs.image_format || github.event.client_payload.image_format || 'png' }}
      JPEG_QUALITY: ${{ github.event.inputs.jpeg_quality || github.event.client_payload.jpeg_quality || '95' }}
      VERIFICATION_PASSES: ${{ github.event.inputs.verification_passes || github.event.client_payload.verification_passes || '0' }}
      MEDIA_RESOLUTION: ${{ github.event.inputs.media_resolution || github.event.client_payload.media_resolution || 'ultra_high' }}
      RPM_PER_KEY: ${{ github.event.inputs.rpm_per_key || github.event.client_payload.rpm_per_key || '15' }}
      RPD_PER_KEY: ${{ github.event.inputs.rpd_per_key || github.event.client_payload.rpd_per_key || '500' }}
      START_PAGE: ${{ github.event.inputs.start_page || github.event.client_payload.start_page || '' }}
      END_PAGE: ${{ github.event.inputs.end_page || github.event.client_payload.end_page || '' }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      MODELFLARE_API_KEYS: ${{ secrets.MODELFLARE_API_KEYS }}
      GEMINI_KEY_GROUPS: ${{ vars.GEMINI_KEY_GROUPS }}
      GEMINI_QUOTA_API_URL: ${{ vars.GEMINI_QUOTA_API_URL }}
      GEMINI_QUOTA_API_TOKEN: ${{ secrets.GEMINI_QUOTA_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate trigger payload
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CONVERSION_TYPE}" != "pdf_to_md" ]]; then
            echo "Unsupported conversion_type: ${CONVERSION_TYPE}" >&2
            exit 1
          fi
          if [[ -z "${SOURCE_URL}" ]]; then
            echo "source_url is required" >&2
            exit 1
          fi
          if [[ "${PROVIDER}" == "gemini" ]]; then
            if [[ -z "${GEMINI_API_KEYS}" || -z "${GEMINI_QUOTA_API_URL}" || -z "${GEMINI_QUOTA_API_TOKEN}" ]]; then
              echo "Gemini requires GEMINI_API_KEYS, GEMINI_QUOTA_API_URL, and GEMINI_QUOTA_API_TOKEN" >&2
              exit 1
            fi
            if [[ -z "${GEMINI_KEY_GROUPS}" ]]; then
              echo "::warning::Repository variable GEMINI_KEY_GROUPS is empty. Generate the list with deploy/print-key-groups.py so the quota pool can group keys by Google Cloud project."
            fi
          elif [[ "${PROVIDER}" == "modelflare" ]]; then
            if [[ -z "${MODELFLARE_API_KEYS}" ]]; then
              echo "Repository secret MODELFLARE_API_KEYS is required" >&2
              exit 1
            fi
            if [[ -z "${MODEL}" ]]; then
              echo "A vision-capable Modelflare model ID is required" >&2
              exit 1
            fi
          else
            echo "Unsupported provider: ${PROVIDER}" >&2
            exit 1
          fi

      - name: Convert PDF to Markdown
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --conversion-type "${CONVERSION_TYPE}"
            --provider "${PROVIDER}"
            --source-url "${SOURCE_URL}"
            --images-per-request "${IMAGES_PER_REQUEST}"
            --concurrency "${CONCURRENCY}"
            --model "${MODEL}"
            --model-fallbacks "${MODEL_FALLBACKS}"
            --reasoning-effort "${REASONING_EFFORT}"
            --max-output-tokens "${MAX_OUTPUT_TOKENS}"
            --retry-rounds "${RETRY_ROUNDS}"
            --attempts-per-page "${ATTEMPTS_PER_PAGE}"
            --hedge-after "${HEDGE_AFTER}"
            --hedge-budget "${HEDGE_BUDGET}"
            --thinking-level "${THINKING_LEVEL}"
            --dpi "${DPI}"
            --image-format "${IMAGE_FORMAT}"
            --jpeg-quality "${JPEG_QUALITY}"
            --verification-passes "${VERIFICATION_PASSES}"
            --media-resolution "${MEDIA_RESOLUTION}"
            --rpm-per-key "${RPM_PER_KEY}"
            --rpd-per-key "${RPD_PER_KEY}"
            --work-dir work
            --output-dir output
          )
          if [[ -n "${SYSTEM_PROMPT}" ]]; then
            args+=(--system-prompt "${SYSTEM_PROMPT}")
          fi
          if [[ -n "${USER_PROMPT}" ]]; then
            args+=(--prompt "${USER_PROMPT}")
          fi
          if [[ -n "${START_PAGE}" ]]; then
            args+=(--start-page "${START_PAGE}")
          fi
          if [[ -n "${END_PAGE}" ]]; then
            args+=(--end-page "${END_PAGE}")
          fi
          python -u pdf2md.py "${args[@]}"

      - name: Name Markdown result
        if: always()
        run: python prepare_result.py

      - name: Conversion summary
        if: always()
        run: python write_summary.py

      - name: Upload Markdown result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: file-converter-pdf-to-md-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 3
