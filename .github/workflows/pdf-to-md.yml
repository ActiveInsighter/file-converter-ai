name: PDF to Markdown with Gemini

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "PDF download URL (Google Drive shared link is supported)"
        required: true
        type: string
      images_per_request:
        description: "How many consecutive PDF pages/images to send in one Gemini request"
        required: true
        default: "1"
        type: string
      concurrency:
        description: "Maximum simultaneous Gemini requests"
        required: true
        default: "5"
        type: string
      prompt:
        description: "Prompt. Leave empty to use the built-in faithful Markdown conversion prompt"
        required: false
        default: ""
        type: string
      model:
        description: "Gemini model ID"
        required: true
        default: "gemini-3.5-flash-lite"
        type: string
      dpi:
        description: "PDF render DPI"
        required: true
        default: "180"
        type: string
      jpeg_quality:
        description: "JPEG quality (50-100)"
        required: true
        default: "88"
        type: string

  repository_dispatch:
    types: [pdf_to_md]

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      SOURCE_URL: ${{ github.event.inputs.source_url || github.event.client_payload.source_url }}
      IMAGES_PER_REQUEST: ${{ github.event.inputs.images_per_request || github.event.client_payload.images_per_request || '1' }}
      CONCURRENCY: ${{ github.event.inputs.concurrency || github.event.client_payload.concurrency || '5' }}
      USER_PROMPT: ${{ github.event.inputs.prompt || github.event.client_payload.prompt || '' }}
      MODEL: ${{ github.event.inputs.model || github.event.client_payload.model || 'gemini-3.5-flash-lite' }}
      DPI: ${{ github.event.inputs.dpi || github.event.client_payload.dpi || '180' }}
      JPEG_QUALITY: ${{ github.event.inputs.jpeg_quality || github.event.client_payload.jpeg_quality || '88' }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate trigger payload
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SOURCE_URL}" ]]; then
            echo "source_url is required" >&2
            exit 1
          fi
          if [[ -z "${GEMINI_API_KEYS}" ]]; then
            echo "Repository secret GEMINI_API_KEYS is required" >&2
            exit 1
          fi

      - name: Convert PDF to Markdown
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --source-url "${SOURCE_URL}"
            --images-per-request "${IMAGES_PER_REQUEST}"
            --concurrency "${CONCURRENCY}"
            --model "${MODEL}"
            --dpi "${DPI}"
            --jpeg-quality "${JPEG_QUALITY}"
            --work-dir work
            --output-dir output
          )
          if [[ -n "${USER_PROMPT}" ]]; then
            args+=(--prompt "${USER_PROMPT}")
          fi
          python pdf2md.py "${args[@]}"

      - name: Upload Markdown result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-to-md-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 3
