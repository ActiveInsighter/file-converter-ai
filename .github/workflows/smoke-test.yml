name: Temporary PDF2MD smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/smoke-test.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run full PDF test
        run: |
          python pdf2md.py \
            --source-url "https://drive.google.com/file/d/14EPNh_iAdchuEcz7Y-jBMXVZJ9AA2aoi/view?usp=drivesdk" \
            --images-per-request 3 \
            --concurrency 10 \
            --model "gemini-3.5-flash-lite" \
            --dpi 180 \
            --jpeg-quality 88 \
            --prompt "请准确阅读这些连续 PDF 页面并转换成 Markdown。保持原始顺序与结构，不要遗漏题目、解答、公式、表格和注释；数学公式使用 LaTeX，行内使用 $...$，独立公式使用 $$...$$；直接输出 Markdown，不要解释处理过程。"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-result-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 1
