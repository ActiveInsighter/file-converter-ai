name: Streaming render benchmark

on:
  push:
    branches:
      - perf/streaming-render
    paths:
      - ".github/workflows/streaming-benchmark.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run streaming PNG conversion
        run: |
          START=$(date +%s)
          python pdf2md.py \
            --source-url "https://drive.google.com/file/d/1Tt-krcZrsVDRMcWLiC1Q9HnBA19oR3zx/view?usp=drivesdk" \
            --images-per-request 1 \
            --concurrency 30 \
            --model "gemini-3.5-flash-lite" \
            --thinking-level high \
            --dpi 240 \
            --image-format png \
            --verification-passes 0 \
            --media-resolution ultra_high \
            --rpm-per-key 12 \
            --rpd-per-key 500 \
            --render-batch-size 24 \
            --work-dir work \
            --output-dir output
          END=$(date +%s)
          echo "[timing] total_seconds=$((END-START))"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streaming-result-${{ github.run_id }}
          path: output/
          retention-days: 1
