name: Gemini API key health check

on:
  push:
    branches:
      - test/validate-67-gemini-keys-v2-20260928
    paths:
      - tools/check_gemini_keys.py
      - .github/workflows/gemini-key-health-check.yml

concurrency:
  group: gemini-key-health-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GEMINI_KEY_GROUPS: ${{ vars.GEMINI_KEY_GROUPS }}

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HTTP client
        run: python -m pip install "httpx>=0.27,<1"

      - name: Probe every configured Gemini key once
        run: python tools/check_gemini_keys.py

      - name: Write summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r = json.loads(Path("reports/gemini-key-health.json").read_text())
          print("# Gemini API key health check")
          print()
          print(f"- Model: `{r['model']}`")
          print(f"- Configured keys: **{r['configured_key_count']}**")
          print(f"- Unique keys: **{r['unique_key_count']}**")
          print(f"- Successful: **{r['success_count']}**")
          print(f"- Failed: **{r['failure_count']}**")
          print()
          print("| Key | Result | HTTP | Latency |")
          print("|---|---:|---:|---:|")
          for item in r["results"]:
              result = "OK" if item["ok"] else "FAIL"
              http = item["http_status"] if item["http_status"] is not None else "-"
              print(f"| {item['label']} | {result} | {http} | {item['latency_ms']} ms |")
          PY

      - name: Commit sanitized health report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/gemini-key-health.json
          git commit -m "test: record sanitized Gemini key health check [skip ci]"
          git push origin HEAD:test/validate-67-gemini-keys-v2-20260928

      - name: Validate expected key count and health
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("reports/gemini-key-health.json").read_text())
          if r["configured_key_count"] != 67:
              raise SystemExit(
                  f"Expected 67 configured keys, found {r['configured_key_count']}"
              )
          if r["failure_count"]:
              raise SystemExit(f"{r['failure_count']} Gemini key(s) failed health check")
          print("All 67 Gemini API keys passed.")
          PY
