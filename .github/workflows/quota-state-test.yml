name: Project quota state integration test

on:
  push:
    branches:
      - feat/project-quota-state

permissions:
  contents: write

concurrency:
  group: md-to-pdf-gemini-api
  queue: max

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GEMINI_KEY_GROUPS: ${{ vars.GEMINI_KEY_GROUPS }}
      GEMINI_QUOTA_STATE_BRANCH: quota-state
      GEMINI_QUOTA_STATE_PATH: quota-state.json
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Syntax and grouping tests
        run: |
          python -m py_compile pdf2md.py quota_state.py
          python - <<'PY'
          from quota_state import parse_key_groups, fresh_state, normalize_state

          assert parse_key_groups(3, "p1\np1\np2") == ["p1", "p1", "p2"]
          assert parse_key_groups(3, "") == [
              "project-1", "project-2", "project-3"
          ]

          state = fresh_state(["p1", "p1", "p2"])
          assert set(state["projects"]) == {"p1", "p2"}
          assert state["keys"]["1"]["project"] == "p1"
          assert state["keys"]["2"]["project"] == "p1"
          assert state["keys"]["3"]["project"] == "p2"

          state["projects"]["p1"]["requests_today"] = 12
          same_day = normalize_state(state, ["p1", "p1", "p2"])
          assert same_day["projects"]["p1"]["requests_today"] == 12
          print("[unit] project grouping and state normalization OK")
          PY

      - name: Snapshot quota state before
        run: |
          python - <<'PY'
          import asyncio, json
          from quota_state import GitHubStateStore
          async def main():
              store = GitHubStateStore.from_env()
              state, sha = await store.load()
              print("[state-before]", json.dumps(state, ensure_ascii=False))
              print("[state-before-sha]", sha)
          asyncio.run(main())
          PY

      - name: One-page live conversion
        run: |
          python pdf2md.py \
            --source-url "https://drive.google.com/file/d/14EPNh_iAdchuEcz7Y-jBMXVZJ9AA2aoi/view?usp=drivesdk" \
            --start-page 1 \
            --end-page 1 \
            --images-per-request 1 \
            --concurrency 1 \
            --model "gemini-3.5-flash-lite" \
            --thinking-level high \
            --dpi 180 \
            --image-format jpeg \
            --jpeg-quality 80 \
            --verification-passes 0 \
            --media-resolution high \
            --rpm-per-key 15 \
            --rpd-per-key 500 \
            --work-dir test-work \
            --output-dir test-output

      - name: Snapshot quota state after
        if: always()
        run: |
          python - <<'PY'
          import asyncio, json
          from quota_state import GitHubStateStore
          async def main():
              store = GitHubStateStore.from_env()
              state, sha = await store.load()
              print("[state-after]", json.dumps(state, ensure_ascii=False))
              print("[state-after-sha]", sha)
          asyncio.run(main())
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quota-state-test-${{ github.run_id }}
          path: test-output/
          retention-days: 1
