name: Temporary PDF inspection

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-new-pdf.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download and inspect PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          import statistics
          import fitz
          import gdown

          url = "https://drive.google.com/file/d/1Tt-krcZrsVDRMcWLiC1Q9HnBA19oR3zx/view?usp=drivesdk"
          out = Path("inspect.pdf")
          gdown.download(url=url, output=str(out), quiet=False, fuzzy=True)
          print(f"[inspect] file_bytes={out.stat().st_size}")

          doc = fitz.open(out)
          print(f"[inspect] pages={doc.page_count}")
          samples = sorted(set([0, 1, doc.page_count//4, doc.page_count//2, (doc.page_count*3)//4, doc.page_count-2, doc.page_count-1]))
          sizes = []
          for idx in samples:
              page = doc[idx]
              rect = page.rect
              pix = page.get_pixmap(matrix=fitz.Matrix(240/72, 240/72), alpha=False)
              data = pix.tobytes("png")
              sizes.append(len(data))
              print(f"[inspect] page={idx+1} points={rect.width:.1f}x{rect.height:.1f} png240_bytes={len(data)} pixels={pix.width}x{pix.height}")
          print(f"[inspect] sample_png240_avg={int(statistics.mean(sizes))}")
          print(f"[inspect] sample_png240_max={max(sizes)}")
          doc.close()
          PY
