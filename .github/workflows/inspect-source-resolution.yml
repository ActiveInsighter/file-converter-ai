name: Temporary source-resolution inspection

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-source-resolution.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Inspect raster source resolution
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz, gdown
          url="https://drive.google.com/file/d/1Tt-krcZrsVDRMcWLiC1Q9HnBA19oR3zx/view?usp=drivesdk"
          p=Path("source.pdf")
          gdown.download(url=url, output=str(p), quiet=True, fuzzy=True)
          doc=fitz.open(p)
          samples=[0,1,104,208,312,414,415]
          for i in samples:
              page=doc[i]
              infos=page.get_image_info(xrefs=True)
              print(f"[source] page={i+1} images={len(infos)}")
              for j,info in enumerate(infos[:5],1):
                  bbox=info.get("bbox")
                  xres=info.get("xres")
                  yres=info.get("yres")
                  print(f"[source] page={i+1} image={j} width={info.get('width')} height={info.get('height')} xres={xres} yres={yres} bbox={bbox}")
          doc.close()
          PY
