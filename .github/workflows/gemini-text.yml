name: AnyWorkflow Gemini · Text messages
run-name: gemini-text-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
      diagnostic_seconds:
        required: false
        type: string
        default: "180"
      model:
        required: false
        type: string
        default: ""
      thinking_level:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  messages:
    if: inputs.request_id == 'startup-benchmark'
    name: ${{ matrix.variant }} ${{ matrix.repetition }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, optimized]
        repetition: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.variant == 'baseline'
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-python@v5
        id: python
        if: matrix.variant == 'optimized'
        with:
          python-version: '3.12'
      - name: Install baseline text dependencies
        if: matrix.variant == 'baseline'
        run: pip install 'httpx>=0.28,<1'
      - uses: actions/cache@v4
        id: text-dependencies
        if: matrix.variant == 'optimized'
        with:
          path: ${{ runner.temp }}/gemini-text-deps
          key: gemini-text-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements-gemini-text.txt') }}
      - name: Install optimized text dependencies
        if: matrix.variant == 'optimized' && steps.text-dependencies.outputs.cache-hit != 'true'
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --no-compile --only-binary=:all: --target "$RUNNER_TEMP/gemini-text-deps"
          -r requirements-gemini-text.txt
      - name: Send a synthetic Antigravity task through the actual executor
        env:
          PYTHONPATH: ${{ matrix.variant == 'optimized' && format('{0}/gemini-text-deps', runner.temp) || '' }}
        run: python -u -m benchmarks.agent_startup_fixture
