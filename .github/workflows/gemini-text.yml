name: AnyWorkflow Gemini · Text messages
run-name: gemini-text-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: PocketBase Gemini job ID (inputs are read from PB)
        required: true
        type: string
      diagnostic_seconds:
        description: Read-only trace window in seconds (10–900; ignored by normal tasks)
        required: false
        default: "180"
        type: string
      model:
        description: Optional Gemini or Antigravity model override
        required: false
        default: ""
        type: string
      thinking_level:
        description: Optional thinking level (minimal, low, medium, high, off)
        required: false
        default: ""
        type: string

permissions:
  contents: read

# A conversation is independent of every other conversation and PDF job.
# Re-runs for the same request ID cannot evict each other.
concurrency:
  group: anyworkflow-gemini-text-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  messages:
    runs-on: ubuntu-latest
    # No application-defined job timeout. GitHub-hosted runners still enforce
    # their platform maximum (currently 6 hours).
    env:
      REQUEST_ID: ${{ inputs.request_id }}
      AGENT_TRACE_SECONDS: ${{ inputs.diagnostic_seconds || '180' }}
      GEMINI_MODEL: ${{ inputs.model }}
      GEMINI_THINKING_LEVEL: ${{ inputs.thinking_level }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GEMINI_KEY_GROUPS: ${{ vars.GEMINI_KEY_GROUPS }}
      ANTIGRAVITY_GITHUB_TOKEN: ${{ secrets.ANTIGRAVITY_GITHUB_TOKEN }}
      GEMINI_PB_URL: ${{ vars.GEMINI_PB_URL || 'https://pb.any1.tech' }}
      POCKETBASE_SERVER_TOKEN: ${{ secrets.POCKETBASE_SERVER_TOKEN }}
      GEMINI_PB_EMAIL: ${{ secrets.GEMINI_PB_EMAIL }}
      GEMINI_PB_PASSWORD: ${{ secrets.GEMINI_PB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      # Cache the importable text dependencies, without the PDF wheels or a
      # pip invocation on cache hits. Python and runner architecture scope the cache.
      - uses: actions/cache/restore@v4
        id: text-dependencies
        with:
          path: ${{ runner.temp }}/gemini-text-deps
          key: gemini-text-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements-gemini-text.txt') }}
      - name: Install text executor dependencies
        id: install-text-dependencies
        if: steps.text-dependencies.outputs.cache-hit != 'true'
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --no-compile --only-binary=:all: --target "$RUNNER_TEMP/gemini-text-deps"
          -r requirements-gemini-text.txt
      - name: Send segments and save replies to PocketBase
        env:
          PYTHONPATH: ${{ runner.temp }}/gemini-text-deps
        run: python -u gemini_text.py
      - name: Preserve replies awaiting a database write
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-text-recovery-${{ github.run_id }}
          path: work/gemini/recovery/*.json
          if-no-files-found: ignore
          retention-days: 3
      # A valid install can warm the next runner even when the model fails.
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.install-text-dependencies.outcome == 'success' }}
        with:
          path: ${{ runner.temp }}/gemini-text-deps
          key: ${{ steps.text-dependencies.outputs.cache-primary-key }}
