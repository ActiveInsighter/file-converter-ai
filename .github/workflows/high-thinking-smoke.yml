name: Temporary high-thinking PDF2MD test
# rerun after output-validation fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/high-thinking-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run full PDF high-thinking test
        run: |
          python pdf2md.py \
            --source-url "https://drive.google.com/file/d/14EPNh_iAdchuEcz7Y-jBMXVZJ9AA2aoi/view?usp=drivesdk" \
            --images-per-request 3 \
            --concurrency 10 \
            --model "gemini-3.5-flash-lite" \
            --thinking-level high \
            --dpi 180 \
            --jpeg-quality 88 \
            --work-dir work \
            --output-dir output
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: high-thinking-result-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 1
