name: Temporary 880 full PDF2MD test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-880-full.yml"

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Convert full 880 PDF
        run: |
          START=$(date +%s)
          python pdf2md.py \
            --source-url "https://drive.google.com/file/d/1Tt-krcZrsVDRMcWLiC1Q9HnBA19oR3zx/view?usp=drivesdk" \
            --images-per-request 1 \
            --concurrency 30 \
            --model "gemini-3.5-flash-lite" \
            --thinking-level high \
            --dpi 240 \
            --image-format png \
            --jpeg-quality 95 \
            --verification-passes 0 \
            --media-resolution ultra_high \
            --rpm-per-key 15 \
            --rpd-per-key 500 \
            --work-dir work \
            --output-dir output
          END=$(date +%s)
          echo "[timing] conversion_seconds=$((END-START))"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 880-full-result-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 1
