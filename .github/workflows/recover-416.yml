name: Temporary recover page 416

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-416.yml"

permissions:
  contents: read
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Download previous 415-page artifact
        uses: actions/download-artifact@v4
        with:
          name: 880-full-result-36311538533
          path: output
          github-token: ${{ github.token }}
          run-id: 36311538533

      - name: Recover only page 416 and rebuild merged Markdown
        run: |
          python pdf2md.py \
            --source-url "https://drive.google.com/file/d/1Tt-krcZrsVDRMcWLiC1Q9HnBA19oR3zx/view?usp=drivesdk" \
            --start-page 416 \
            --end-page 416 \
            --images-per-request 1 \
            --concurrency 1 \
            --model "gemini-3.5-flash-lite" \
            --thinking-level high \
            --dpi 240 \
            --image-format png \
            --jpeg-quality 95 \
            --verification-passes 0 \
            --media-resolution ultra_high \
            --rpm-per-key 15 \
            --rpd-per-key 500 \
            --work-dir work \
            --output-dir output

      - name: Upload recovered complete result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 880-complete-recovered-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 1
