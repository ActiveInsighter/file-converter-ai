name: Flash 5-page challenge

on:
  push:
    branches:
      - bench/flash-math-accuracy
    paths:
      - ".github/workflows/flash-5page-challenge.yml"

permissions:
  contents: read

jobs:
  challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      SOURCE_URL: "https://drive.google.com/file/d/1Tt-krcZrsVDRMcWLiC1Q9HnBA19oR3zx/view?usp=drivesdk"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run one 5-page challenge per model
        run: |
          python - <<'PY'
          import base64, json, os, re, time
          from pathlib import Path
          import fitz, gdown, httpx

          models=['gemini-3.6-flash','gemini-3.7-flash','gemini-3.8-flash']
          pages=[11,20,128,156,270]
          keys=[x.strip() for x in re.split(r'[\r\n,;]+',os.environ['GEMINI_API_KEYS']) if x.strip()]
          key=keys[9]

          pdf=Path('challenge.pdf')
          gdown.download(url=os.environ['SOURCE_URL'],output=str(pdf),quiet=True,fuzzy=True)
          doc=fitz.open(pdf)
          imgs=[]
          for p in pages:
              pix=doc[p-1].get_pixmap(matrix=fitz.Matrix(240/72,240/72),alpha=False)
              data=pix.tobytes('jpeg',jpg_quality=95)
              imgs.append((p,base64.b64encode(data).decode('ascii')))
          doc.close()

          prompt='''高精度数学 PDF 转录。下面 5 张图片依次对应 PDF 页 011、020、128、156、270。
逐页忠实转录为 Markdown，严禁总结或自行修正原文。
特别核对：指数、分式指数、积分上下限、区间端点、矩阵正负号、数字 0/2/4。
每页必须用精确标记开头：===== PAGE NNN =====
不要输出其它解释。'''

          out=Path('challenge-results'); out.mkdir()
          client=httpx.Client(timeout=300.0)
          summary=[]
          for model in models:
              parts=[{'text':prompt}]
              for p,b64 in imgs:
                  parts.append({
                    'inlineData':{'mimeType':'image/jpeg','data':b64},
                    'mediaResolution':{'level':'MEDIA_RESOLUTION_HIGH'}
                  })
              payload={
                'contents':[{'role':'user','parts':parts}],
                'generationConfig':{'thinkingConfig':{'thinkingLevel':'high'}}
              }
              success=False
              for attempt in range(1,4):
                  started=time.time()
                  r=client.post(
                    f'https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent',
                    headers={'x-goog-api-key':key,'Content-Type':'application/json'},
                    json=payload,
                  )
                  elapsed=round(time.time()-started,2)
                  body=r.text
                  print(f'[challenge] model={model} attempt={attempt} status={r.status_code} elapsed={elapsed}s',flush=True)
                  if r.status_code==200:
                      data=r.json()
                      texts=[]
                      for cand in data.get('candidates',[]):
                          for part in (cand.get('content') or {}).get('parts',[]):
                              if part.get('thought'): continue
                              if part.get('text'): texts.append(part['text'])
                      text='\n'.join(texts).strip()
                      (out/f'{model}.md').write_text(text+'\n',encoding='utf-8')
                      summary.append({'model':model,'status':200,'attempt':attempt,'elapsed':elapsed})
                      success=True
                      break
                  print(body[:1200],flush=True)
                  if r.status_code==503:
                      time.sleep(30*attempt)
                  elif r.status_code==429:
                      time.sleep(15)
                  else:
                      break
              if not success:
                  summary.append({'model':model,'status':r.status_code,'attempt':attempt,'body':body[:1200]})
              time.sleep(13)

          (out/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flash-5page-challenge-${{ github.run_id }}
          path: challenge-results/
          if-no-files-found: warn
          retention-days: 2
